<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agentic RL：从偏好优化到工具调用</title>
  <meta name="description" content="从偏好优化到工具调用的 Agentic RL 学习笔记。">
  <script>
    window.MathJax = {
      tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true},
      options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --ink:#1f2328; --muted:#667085; --line:#e7e9ee; --link:#0969da; --paper:#fff; --canvas:#f7f8fa; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--canvas); font:16px/1.82 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
    .topbar { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 max(24px,calc((100vw - 1180px)/2)); background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; backdrop-filter:blur(10px); }
    .brand { font-weight:700; text-decoration:none; color:var(--ink); letter-spacing:.01em; }
    .github { color:var(--muted); text-decoration:none; font-size:14px; }
    .shell { max-width:1180px; margin:0 auto; display:grid; grid-template-columns:minmax(0,820px) 230px; gap:56px; padding:42px 24px 80px; }
    article { min-width:0; background:var(--paper); padding:54px 68px 72px; border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 24px rgba(16,24,40,.035); }
    #toc { position:sticky; top:86px; align-self:start; font-size:14px; max-height:calc(100vh - 110px); overflow:auto; }
    #toc strong { display:block; margin-bottom:10px; color:var(--muted); font-size:12px; letter-spacing:.08em; }
    #toc a { display:block; color:var(--muted); text-decoration:none; padding:3px 0; line-height:1.45; }
    #toc a.level-3 { padding-left:14px; font-size:13px; }
    #toc a:hover { color:var(--link); }
    h1 { font-size:32px; line-height:1.28; margin:0 0 14px; letter-spacing:-.025em; }
    h2 { font-size:25px; line-height:1.35; margin:54px 0 18px; padding-top:8px; }
    h3 { font-size:19px; line-height:1.45; margin:34px 0 12px; }
    h4 { font-size:16px; margin:26px 0 8px; }
    p { margin:14px 0; }
    a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
    ul,ol { padding-left:25px; } li { margin:5px 0; }
    blockquote { margin:22px 0; padding:12px 18px; border-left:4px solid #a9c8f4; background:#f5f9ff; color:#475467; }
    pre { overflow:auto; background:#f6f8fa; padding:16px 18px; border-radius:8px; line-height:1.55; }
    code { font: .88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#f1f3f5; padding:.12em .32em; border-radius:4px; } pre code { background:transparent; padding:0; }
    table { display:block; overflow:auto; width:100%; border-collapse:collapse; margin:20px 0; font-size:14px; } th,td { border:1px solid var(--line); padding:9px 12px; text-align:left; } th { background:#f6f8fa; }
    img { max-width:100%; height:auto; border-radius:8px; border:1px solid var(--line); }
    .mjx-container[display="true"] { overflow-x:auto; overflow-y:hidden; padding:8px 2px; }
    .loading { color:var(--muted); }
    footer { max-width:820px; margin:0 auto 40px; color:var(--muted); font-size:13px; padding:0 24px; }
    @media (max-width:900px) { .shell { display:block; padding:20px 12px 48px; } article { padding:32px 24px 44px; border-radius:10px; } #toc { display:none; } h1 { font-size:28px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Agentic RL Notes</a>
    <a class="github" href="https://github.com/KS-superbig/agentic-rl-notes">GitHub ↗</a>
  </header>
  <main class="shell">
    <article id="article"><p class="loading">正在加载文章…</p></article>
    <nav id="toc"><strong>目录</strong></nav>
  </main>
  <footer>个人学习笔记 · 持续更新中</footer>
  <script>
    async function render() {
      const article = document.getElementById('article');
      const text = await fetch('./index.md').then(r => { if (!r.ok) throw new Error('文章加载失败'); return r.text(); });
      const md = text.replace(/^---[\s\S]*?---\s*/, '');
      article.innerHTML = marked.parse(md, {gfm:true, breaks:false});
      const toc = document.getElementById('toc');
      [...article.querySelectorAll('h2,h3')].forEach((h, i) => {
        h.id = h.id || 'section-' + i;
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.className = h.tagName === 'H3' ? 'level-3' : '';
        toc.appendChild(a);
      });
      if (window.MathJax) await MathJax.typesetPromise([article]);
    }
    render().catch(e => document.getElementById('article').innerHTML = '<p class="loading">' + e.message + '</p>');
  </script>
</body>
</html>
