<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Agentic RL 学习笔记"><title>Agentic RL Notes</title>
<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--ink:#202124;--muted:#6b7280;--line:#e6e8eb;--bg:#f7f7f5;--accent:#185abc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:17px/1.85 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.top{border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:2;backdrop-filter:blur(8px)}.top-inner{max-width:1120px;margin:auto;padding:13px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{color:var(--ink);text-decoration:none;font-weight:700}.tag{font-size:13px;color:var(--muted)}main{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,760px);gap:54px;padding:54px 30px 90px}nav{position:sticky;top:75px;align-self:start;font-size:13px;line-height:1.55;max-height:80vh;overflow:auto}nav b{display:block;margin-bottom:10px;color:var(--muted);font-size:11px;letter-spacing:.08em}nav a{display:block;color:var(--muted);text-decoration:none;padding:5px 0}nav a:hover,a{color:var(--accent)}article{min-width:0;background:#fff;padding:14px 4px}article>h1:first-child{font-size:2.4rem;line-height:1.25;letter-spacing:-.04em;margin:0 0 1.2em}h1,h2,h3{line-height:1.35;letter-spacing:-.025em;scroll-margin-top:80px}h2{font-size:1.55rem;margin:3.1em 0 .8em;padding-bottom:.35em;border-bottom:1px solid var(--line)}h3{font-size:1.18rem;margin:2.1em 0 .55em}p,li{overflow-wrap:anywhere}code{background:#f2f3f5;border-radius:4px;padding:.12em .34em;font-size:.88em}pre{padding:18px;overflow:auto;background:#f5f6f7;border:1px solid var(--line);border-radius:8px}pre code{padding:0;background:none}blockquote{margin:1.3em 0;padding:.55em 1em;color:#4b5563;background:#f6f9ff;border-left:3px solid #7aa4dd}table{display:block;overflow:auto;border-collapse:collapse;margin:1.25em 0}th,td{padding:9px 12px;border:1px solid var(--line)}th{background:#f8f9fa}img{max-width:100%}.error{padding:18px;border:1px solid #efb5b5;background:#fff5f5;color:#9b1c1c;border-radius:8px}@media(max-width:850px){main{display:block;padding:35px 20px 70px}nav{display:none}article>h1:first-child{font-size:2rem}.top-inner{padding:12px 20px}}
</style></head><body>
<header class="top"><div class="top-inner"><a class="brand" href="./">Agentic RL Notes</a><span class="tag">从偏好优化到工具调用</span></div></header>
<main><nav id="toc"><b>目录</b></nav><article id="article" aria-live="polite">正在加载笔记…</article></main>
<script>
async function render(){const article=document.getElementById('article');const response=await fetch('./article.txt',{cache:'no-cache'});if(!response.ok)throw new Error('未能读取文章源文件（HTTP '+response.status+'）');article.innerHTML=marked.parse(await response.text(),{gfm:true,breaks:false});const toc=document.getElementById('toc');article.querySelectorAll('h1,h2,h3').forEach((heading,i)=>{heading.id||='section-'+i;const link=document.createElement('a');link.href='#'+heading.id;link.textContent=heading.textContent;link.style.paddingLeft=heading.tagName==='H3'?'12px':'0';toc.appendChild(link)});if(window.MathJax?.typesetPromise)await MathJax.typesetPromise([article])}
window.addEventListener('DOMContentLoaded',()=>{render().catch(error=>{document.getElementById('article').innerHTML='<div class="error"><b>文章加载失败：</b>'+error.message+'</div>'})});
</script></body></html>
